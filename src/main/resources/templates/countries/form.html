<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: body}">
<body>
<h2 th:text="${country.id} != null ? 'Edit Country' : 'Add Country'"></h2>

<form th:action="${country.id} != null ? @{|/countries/${country.id}/edit|} : @{/countries/add}"
      method="post" th:object="${country}">
    <label>Name: <input type="text" th:field="*{name}" required></label><br/>
    <label>Code: <input type="text" th:field="*{code}" required></label><br/>
    <button type="submit">Save</button>
</form>

</body>
</html>
