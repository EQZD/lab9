<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${item.id} != null ? 'Edit Item' : 'Add Item'">Item</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">Demo</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav" aria-controls="navbarNav"
                aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/countries}">Countries</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/items}">Items</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container mt-4">
    <h2 th:text="${item.id} != null ? 'Edit Item' : 'Add Item'"></h2>

    <form th:action="${item.id} != null ? @{|/items/${item.id}/edit|} : @{/items/add}"
          method="post" th:object="${item}" class="mt-3">

        <div class="mb-3">
            <label class="form-label">Name</label>
            <input class="form-control" type="text" th:field="*{name}" required/>
        </div>

        <div class="mb-3">
            <label class="form-label">Price</label>
            <input class="form-control" type="number" min="0" th:field="*{price}" required/>
        </div>

        <div class="mb-3">
            <label class="form-label">Quantity</label>
            <input class="form-control" type="number" min="0" th:field="*{quantity}" required/>
        </div>

        <div class="mb-3">
            <label class="form-label">Manufacturer</label>
            <select class="form-select" th:field="*{manufacturerId}" required>
                <option value="" hidden>Select country</option>
                <option th:each="c : ${countries}"
                        th:value="${c.id}"
                        th:text="${c.name}"></option>
            </select>
        </div>

        <button class="btn btn-primary" type="submit">Save</button>
        <a class="btn btn-secondary ms-2" th:href="@{/items}">Cancel</a>
    </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
